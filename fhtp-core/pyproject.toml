[project]
name = "fhtp-core"
version = "0.1.0"
description = "FITTER Health Trust Platform -- moteur de validation des dossiers de facturation de sante (Togo)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietaire -- Dr Aboudourazak Amadou / FHTP" }
authors = [{ name = "Dr Aboudourazak Amadou" }]

dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",   # upload de fichiers (soumission groupee, section 14)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "locust>=2.24",              # tests de charge (section 19.5)
    "ruff>=0.4",
    "mypy>=1.9",
    "httpx>=0.27",                # requis par fastapi.testclient
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fhtp_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
